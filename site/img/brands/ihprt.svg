<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-hidden="true">
  <!-- IHPRT: heart + PR flag rotated — star on top, triangle points down, vertical stripes -->
  <defs>
    <clipPath id="ihprt-heart">
      <path d="M50 90C22 68 10 52 10 34 10 21 20 12 32 12c7 0 13 3.5 18 10 5-6.5 11-10 18-10 12 0 22 9 22 22 0 18-12 34-40 56z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ihprt-heart)">
    <!-- Five vertical stripes (R W R W R) -->
    <rect x="0" y="0" width="20" height="100" fill="#ED0000"/>
    <rect x="20" y="0" width="20" height="100" fill="#FFFFFF"/>
    <rect x="40" y="0" width="20" height="100" fill="#ED0000"/>
    <rect x="60" y="0" width="20" height="100" fill="#FFFFFF"/>
    <rect x="80" y="0" width="20" height="100" fill="#ED0000"/>
    <!-- Navy triangle at top, pointing down -->
    <path d="M6 6 H94 L50 56 Z" fill="#002D62"/>
    <!-- White star (lowered so it clears the heart cleft) -->
    <path fill="#FFFFFF" transform="translate(50 33) scale(0.95)" d="M0-11 L3.1-3.4 11-3.4 4.7 1.4 7.1 9.2 0 4.4 -7.1 9.2 -4.7 1.4 -11-3.4 -3.1-3.4 Z"/>
  </g>
  <path fill="none" stroke="#F3F4F6" stroke-width="2.2" stroke-linejoin="round"
        d="M50 90C22 68 10 52 10 34 10 21 20 12 32 12c7 0 13 3.5 18 10 5-6.5 11-10 18-10 12 0 22 9 22 22 0 18-12 34-40 56z"/>
</svg>
